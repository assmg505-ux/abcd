plugins {
    id 'com.android.application'
}

// Optional release signing: create keystore.properties (never commit it) with
// storeFile, storePassword, keyAlias, keyPassword to build a Play Store release.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'com.gubbies.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gubbies.game'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
